spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Fix: reduce pool size to stay under PgBouncer's limit of 15
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Fix: disable DDL execution to avoid extra connection at startup
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
gemini.key=${GEMINI_KEY}
cloudinary.url=${CLOUDINARY_URL}

# Claude judge for AI scope generation (blank key disables the judge)
anthropic.key=${ANTHROPIC_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
scoping.judge.threshold=${SCOPING_JUDGE_THRESHOLD:85}
scoping.judge.max-redos=${SCOPING_JUDGE_MAX_REDOS:2}

# Outbound HTTP (shared RestTemplate: Gemini, gap analysis, Hugging Face embeddings)
http.client.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:10000}
http.client.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:90000}

google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.refresh.token=${GOOGLE_REFRESH_TOKEN:}
google.from.email=${GMAIL_USERNAME:}

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

logging.level.org.springframework.security=DEBUG